name: Build "PwdMgr New" APK

on:
  push:
    branches: [claude/expense-sms-accuracy]
  workflow_dispatch:

permissions:
  contents: write   # to publish the APK as a GitHub release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon testDebugUnitTest

      - name: Use the fixed signing key, if configured
        env:
          KEYSTORE_B64: ${{ secrets.DEBUG_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.DEBUG_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/pwdmgrnew.jks"
            echo "CI_KEYSTORE_PATH=$RUNNER_TEMP/pwdmgrnew.jks" >> "$GITHUB_ENV"
            echo "CI_KEYSTORE_PASSWORD=$KEYSTORE_PASSWORD" >> "$GITHUB_ENV"
            echo "Signing with the fixed key: the APK installs as an update."
          else
            echo "::warning::No DEBUG_KEYSTORE_B64 secret: random key, uninstall the old PwdMgr New before installing."
          fi

      - name: Build debug APK (installs alongside the existing app)
        run: ./gradlew --no-daemon assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk PwdMgr-New.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PwdMgr-New
          path: PwdMgr-New.apk

      - name: Publish to the "pwdmgr-new-latest" pre-release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete pwdmgr-new-latest --yes --cleanup-tag || true
          gh release create pwdmgr-new-latest PwdMgr-New.apk \
            --prerelease \
            --target "$GITHUB_SHA" \
            --title "PwdMgr New (test build)" \
            --notes "Installs as a separate app named 'PwdMgr New' next to the existing Password Manager; it does not replace it or touch its data. Debug-signed test build from branch ${GITHUB_REF_NAME} (${GITHUB_SHA::7})."
