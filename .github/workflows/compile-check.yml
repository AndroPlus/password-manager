name: Compile check (no APK published)

# Push work-in-progress to claude/compile-check to make sure it builds,
# without publishing a new test APK.
on:
  push:
    branches: [claude/compile-check]

jobs:
  compile:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and run unit tests
        run: chmod +x gradlew && ./gradlew --no-daemon assembleDebug testDebugUnitTest
